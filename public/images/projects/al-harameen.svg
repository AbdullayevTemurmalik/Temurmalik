<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="750" fill="#0C1017" />

  <!-- Subtle Pattern -->
  <defs>
    <pattern id="ah-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A2230" stroke-width="0.8" opacity="0.6" />
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#ah-grid)" />

  <!-- Browser Navigation Bar -->
  <rect x="50" y="30" width="1100" height="60" rx="10" fill="#141B26" stroke="#222E40" stroke-width="1.5" />
  <circle cx="80" cy="60" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="100" cy="60" r="5" fill="#F59E0B" opacity="0.8" />
  <circle cx="120" cy="60" r="5" fill="#10B981" opacity="0.8" />

  <!-- URL Bar -->
  <rect x="150" y="44" width="480" height="32" rx="6" fill="#0C1017" stroke="#222E40" stroke-width="1" />
  <text x="170" y="65" fill="#E3B341" font-family="monospace" font-size="12">https://alharameenuz.uz</text>
  <text x="350" y="65" fill="#6B7280" font-family="monospace" font-size="11">🔒 Rasmiy Distributor</text>

  <rect x="940" y="46" width="180" height="28" rx="6" fill="#E3B341" fill-opacity="0.15" stroke="#E3B341" stroke-width="1" />
  <text x="960" y="64" fill="#E3B341" font-family="sans-serif" font-size="12" font-weight="bold">Katalogni ko&apos;rish ↗</text>

  <!-- Hero Banner of Brand -->
  <rect x="50" y="110" width="1100" height="280" rx="12" fill="#141B26" stroke="#222E40" stroke-width="1.5" />
  
  <text x="90" y="170" fill="#E3B341" font-family="monospace" font-size="14" font-weight="bold">AL HARAMEEN UZBEKISTAN</text>
  <text x="90" y="215" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="bold">O&apos;zbekistondagi Rasmiy Distributor</text>
  <text x="90" y="250" fill="#9CA3AF" font-family="sans-serif" font-size="15">Azon ovozi, namoz vaqtlari va qibla yo&apos;nalishini ko&apos;rsatuvchi original aqlli islomiy soatlar.</text>
  <text x="90" y="275" fill="#9CA3AF" font-family="sans-serif" font-size="15">1 yillik rasmiy kafolat va O&apos;zbekiston bo&apos;ylab xavfsiz yetkazib berish.</text>

  <!-- Feature Highlights Row inside Hero -->
  <g transform="translate(90, 310)">
    <rect x="0" y="0" width="220" height="50" rx="8" fill="#1F2A3D" />
    <text x="20" y="30" fill="#E5E7EB" font-family="sans-serif" font-size="13">🔔 Azon audio bildirishnomasi</text>

    <rect x="240" y="0" width="220" height="50" rx="8" fill="#1F2A3D" />
    <text x="260" y="30" fill="#E5E7EB" font-family="sans-serif" font-size="13">🧭 Qibla aniq kompas</text>

    <rect x="480" y="0" width="220" height="50" rx="8" fill="#1F2A3D" />
    <text x="500" y="30" fill="#E5E7EB" font-family="sans-serif" font-size="13">🛡️ 1 yillik rasmiy kafolat</text>
  </g>

  <!-- Watch Visual Silhouette Box -->
  <rect x="880" y="140" width="230" height="220" rx="10" fill="#0C1017" stroke="#222E40" stroke-width="1" />
  <circle cx="995" cy="250" r="65" fill="#1F2A3D" stroke="#E3B341" stroke-width="2" />
  <text x="965" y="245" fill="#E3B341" font-family="monospace" font-size="14" font-weight="bold">12:45</text>
  <text x="965" y="265" fill="#9CA3AF" font-family="sans-serif" font-size="10">Peshin: 12:54</text>

  <!-- Product Showcase Grid (3 Cards) -->
  <g transform="translate(50, 410)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="345" height="290" rx="10" fill="#141B26" stroke="#222E40" stroke-width="1.5" />
    <rect x="20" y="20" width="305" height="140" rx="8" fill="#0C1017" />
    <text x="110" y="100" fill="#6B7280" font-family="sans-serif" font-size="13">[ Soat modeli HA-6260 ]</text>
    <text x="20" y="190" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Al Harameen HA-6260</text>
    <text x="20" y="215" fill="#9CA3AF" font-family="sans-serif" font-size="13">Klassik metall korpus, azon eslatmasi</text>
    <text x="20" y="250" fill="#E3B341" font-family="monospace" font-size="15" font-weight="bold">Original Distributor Mahsuloti</text>

    <!-- Card 2 -->
    <rect x="375" y="0" width="345" height="290" rx="10" fill="#141B26" stroke="#222E40" stroke-width="1.5" />
    <rect x="395" y="20" width="305" height="140" rx="8" fill="#0C1017" />
    <text x="490" y="100" fill="#6B7280" font-family="sans-serif" font-size="13">[ Soat modeli HA-6351 ]</text>
    <text x="395" y="190" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Al Harameen HA-6351</text>
    <text x="395" y="215" fill="#9CA3AF" font-family="sans-serif" font-size="13">Charm tasmali, ixcham va zamonaviy</text>
    <text x="395" y="250" fill="#E3B341" font-family="monospace" font-size="15" font-weight="bold">1 Yil Rasmiy Kafolat</text>

    <!-- Card 3 -->
    <rect x="750" y="0" width="350" height="290" rx="10" fill="#141B26" stroke="#222E40" stroke-width="1.5" />
    <rect x="770" y="20" width="310" height="140" rx="8" fill="#0C1017" />
    <text x="860" y="100" fill="#6B7280" font-family="sans-serif" font-size="13">[ Stol va Devor Soati ]</text>
    <text x="770" y="190" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Al Harameen Devor Soati</text>
    <text x="770" y="215" fill="#9CA3AF" font-family="sans-serif" font-size="13">Uy va ofislar uchun to&apos;liq azon audiosi</text>
    <text x="770" y="250" fill="#E3B341" font-family="monospace" font-size="15" font-weight="bold">Toshkent &amp; Butun O&apos;zbekiston</text>
  </g>
</svg>
